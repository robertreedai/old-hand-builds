.nxt{border:1px solid var(--c,var(--cy));background:rgba(94,231,255,.05);padding:11px 12px;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.nxt p{font-weight:650;color:var(--tx)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.meta div{border:1px solid rgba(120,190,255,.16);padding:8px 10px;background:rgba(6,14,28,.5)}
.meta span{display:block;font:700 8.5px/1 var(--mono);letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-bottom:5px}
.meta b{font-size:13px;line-height:1.3;font-weight:600}
.meta em{display:block;font-style:normal;color:var(--mu);font-size:11.5px;margin-top:2px}
.loop{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:4px;align-items:stretch}
.loop div{border:1px solid rgba(120,190,255,.2);padding:8px 7px;font-size:11.5px;line-height:1.35;color:#c9d9ee;background:rgba(6,14,28,.5)}
.loop div b{display:block;font:700 8.5px/1 var(--mono);letter-spacing:.14em;margin-bottom:4px;color:var(--vi)}
.loop div.you b{color:var(--am)} .loop div.po b{color:var(--gr)}
.loop i{align-self:center;color:var(--mu);font-style:normal;font-size:12px}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.track div{padding:7px 0 6px;text-align:center;font:700 8.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);border:1px solid rgba(120,190,255,.15);background:rgba(6,14,28,.5)}
.track div.on{color:#021018;background:var(--c);border-color:var(--c);box-shadow:0 0 14px var(--c)}
.note{margin-top:8px;font:600 11px/1.45 var(--mono);color:var(--mu)}
.rows{display:grid;gap:6px}
.row{appearance:none;display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 10px;border:1px solid rgba(120,190,255,.2);background:rgba(6,14,28,.6);color:var(--tx);text-align:left;cursor:pointer;font:inherit}
.row:active{background:rgba(94,231,255,.1)}
.row .dt{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.row .dt.off{background:none;border:1.5px dashed var(--c);box-shadow:none}
.row .nm{flex:1;min-width:0;font-size:14px;font-weight:650;line-height:1.25}
.row .nm small{display:block;font:600 9px/1.3 var(--mono);letter-spacing:.12em;color:var(--mu);text-transform:uppercase;margin-top:3px}
.row .gv{flex:none;display:flex;gap:2px}
.row .gv s{width:7px;height:14px;border:1px solid rgba(92,255,176,.35)}
.row .gv s.on{background:var(--c);border-color:var(--c);box-shadow:0 0 6px var(--c)}
.row .ch{color:var(--mu);font-family:var(--mono)}
.acts{display:grid;gap:8px;margin-top:16px}
.btn{appearance:none;display:flex;align-items:center;justify-content:center;gap:9px;min-height:50px;font:800 13px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer;border:1px solid rgba(120,190,255,.4);color:var(--tx);background:rgba(10,24,44,.85);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.btn.pri{background:linear-gradient(180deg,#39d6f5,#138fb2);border-color:var(--cy);color:#021018}
.btn.off{opacity:.38;pointer-events:none}
.btn .ph{font-size:8.5px;padding:3px 5px;border:1px solid rgba(255,181,71,.7);color:var(--am)}
.btn:active{transform:scale(.98)}
details.pv{margin-top:12px;border:1px solid rgba(120,190,255,.16);padding:0 12px;background:rgba(6,14,28,.5)}
details.pv summary{cursor:pointer;padding:12px 0;font:700 9.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mu);list-style:none}
details.pv summary::-webkit-details-marker{display:none}
details.pv p{margin:0 0 12px;font-size:13.5px;line-height:1.5;color:#c3d3e8;white-space:pre-wrap}
.link{margin-top:10px;font:500 11.5px/1.4 var(--mono);color:var(--mu);word-break:break-all}
.toast{position:fixed;left:50%;top:calc(90px + var(--st));z-index:60;transform:translate(-50%,-10px);opacity:0;transition:all .25s;background:#07223a;border:1px solid var(--cy);color:var(--tx);padding:10px 14px;font:700 11px/1 var(--mono);letter-spacing:.1em;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){.ctrs{justify-content:flex-start}.ctr{flex:0 0 auto;min-width:112px}}
@media (max-width:360px){.logo{font-size:10px;letter-spacing:.1em}}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hyper{position:fixed;left:12px;bottom:calc(12px + var(--sb));z-index:9;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;text-decoration:none;color:var(--tx);-webkit-tap-highlight-color:transparent}
.hyper .ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,207,90,.75);box-shadow:0 0 14px rgba(255,207,90,.55),inset 0 0 12px rgba(255,207,90,.35);background:radial-gradient(circle,rgba(255,236,170,.95) 0 9%,rgba(255,190,80,.35) 22%,rgba(120,60,200,.28) 48%,rgba(2,4,10,.7) 70%);animation:hyspin 6s linear infinite}
.hyper .ring:before,.hyper .ring:after{content:"";position:absolute;inset:7px;border-radius:50%;border:1px dashed rgba(77,252,255,.6)}
.hyper .ring:after{inset:15px;border:1px solid rgba(255,207,90,.5);animation:hypulse 2.2s ease-in-out infinite}
.hyper .lbl{position:absolute;bottom:calc(100% + 6px);left:0;white-space:nowrap;font:800 8.5px/1.25 var(--mono);letter-spacing:.18em;color:#ffcf5a;text-shadow:0 0 8px rgba(255,207,90,.7);text-transform:uppercase}
.hyper .lbl small{display:block;color:var(--mu);font-size:7.5px;letter-spacing:.2em}
.hyper:active{transform:scale(.93)}
@keyframes hyspin{to{transform:rotate(360deg)}}
@keyframes hypulse{50%{transform:scale(.72);opacity:.4}}
.warp{position:fixed;inset:0;z-index:95;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(200,230,255,.0) 0deg 3deg,rgba(200,230,255,.55) 3.3deg 3.6deg,rgba(200,230,255,0) 4deg 9deg),radial-gradient(circle at 50% 50%,rgba(255,240,200,.9),rgba(2,4,10,.95) 60%);transform:scale(.4);transition:opacity .45s ease-in,transform .5s ease-in}
body.jumping .warp{opacity:1;transform:scale(2.4)}
@media (prefers-reduced-motion:reduce){.hyper .ring,.hyper .ring:after{animation:none}.warp{transition:none}}

<body>

<script>
(function(){
"use strict";
var DATA=JSON.parse(document.getElementById('station-data').textContent);
var items=DATA.items||[], crew=DATA.crew||[], fuel=DATA.fuel||[], modules=DATA.modules||[];
var RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function fd(d){return MON[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();}
function rel(d){var a=new Date();a.setHours(0,0,0,0);var b=new Date(d);b.setHours(0,0,0,0);var n=Math.round((a-b)/864e5);return n<=0?'today':n===1?'yesterday':n+' days ago';}
function stamp(s){var d=pd(s);if(!d)return'';var h=d.getHours(),m=d.getMinutes(),ap=h>=12?'PM':'AM';h=h%12||12;return MON[d.getMonth()]+' '+d.getDate()+' · '+h+':'+(m<10?'0':'')+m+' '+ap;}
var isPriv=function(i){return/^private, not public yet/i.test(i.summary||'');};
var TYPEC={build:'#5ee7ff',bot:'#b69cff',routine:'#5cffb0',marketing:'#ff7ad9',artifact:'#7aa2ff',idea:'#dfe9ff',win:'#c9a2ff'};
var STAGE={none:0,idea:1,building:2,live:3,earning:4};
var STAGEC=['#5d6f88','#ffb547','#5ee7ff','#5cffb0','#ffd76a'];
var byId={};items.forEach(function(i){byId[i.id]=i;});
var crewById={};crew.forEach(function(c){crewById[c.id]=c;});
var fuelById={};fuel.forEach(function(f){fuelById[f.id]=f;});
var modById={};modules.forEach(function(m){modById[m.id]=m;});
function st(s){return items.filter(function(i){return i.state===s;});}
var need=st('needs_you'),work=st('working'),str=st('stranded'),dock=st('docked'),wins=st('win');
var realFuel=fuel.filter(function(f){return f.part!=='empty';});
var liveFuel=realFuel.filter(function(f){return STAGE[f.stage]>=3;}).length;
var activeCrew=crew.filter(function(c){return c.state==='active';}).length;
document.getElementById('stamp').innerHTML='UPDATED<br>'+esc(stamp(DATA.updated));

var cv=document.getElementById('scene'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1,portrait=true,L={};
var cam={x:0,y:0,z:1},camT=null,home={x:0,y:0,z:1},userMoved=false,openObj=null;
function rng(seed){return function(){seed=(seed*16807)%2147483647;return seed/2147483647;};}
var bg={},asts=[];
function layout(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  portrait=W/H<1.05;
  var hudH=document.querySelector('.hud').offsetHeight;
  if(portrait)L={wh:[{x:-82,y:-300},{x:100,y:-318},{x:-150,y:-360}],ast:{x:30,y:296,rx:160,ry:44},hw:212,top:-360,bot:352};
  else L={wh:[{x:-440,y:-40},{x:-470,y:150},{x:-330,y:-190}],ast:{x:440,y:60,rx:115,ry:125},hw:560,top:-235,bot:240};
  var sceneH=L.bot-L.top,availH=H-hudH-(portrait?54:30),z=Math.min(W/(2*L.hw),availH/sceneH);
  if(!portrait)z=Math.min(z,1.55);
  var midY=(L.top+L.bot)/2,screenMid=hudH+availH/2;
  home={x:0,y:midY-(screenMid-H/2)/z,z:z};
  if(!userMoved&&!openObj){cam.x=home.x;cam.y=home.y;cam.z=home.z;}
  buildBG();buildAsteroids();
}
function buildBG(){
  var r=rng(11);
  var n=document.createElement('canvas'),nw=Math.ceil(W/2),nh=Math.ceil(H/2);n.width=nw;n.height=nh;var c=n.getContext('2d');
  c.fillStyle='#02040a';c.fillRect(0,0,nw,nh);
  var blobs=[[.15,.2,.55,'40,110,190',.34],[.88,.32,.5,'120,60,200',.32],[.72,.88,.6,'200,60,140',.16],[.2,.82,.45,'30,160,170',.15],[.5,.5,.35,'90,70,220',.10]];
  c.globalCompositeOperation='lighter';
  blobs.forEach(function(b){for(var k=0;k<7;k++){var x=(b[0]+(r()-.5)*.3)*nw,y=(b[1]+(r()-.5)*.3)*nh,rad=b[2]*Math.max(nw,nh)*(.35+r()*.5);
    var g=c.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,'rgba('+b[3]+','+(b[4]*(.4+r()*.5)).toFixed(3)+')');g.addColorStop(1,'rgba('+b[3]+',0)');c.fillStyle=g;c.fillRect(0,0,nw,nh);}});
  c.globalCompositeOperation='source-over';
  for(var k=0;k<60;k++){var x=r()*nw,y=r()*nh,rad=20+r()*80;var g=c.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,'rgba(2,4,10,'+(.25+r()*.3)+')');g.addColorStop(1,'rgba(2,4,10,0)');c.fillStyle=g;c.fillRect(x-rad,y-rad,rad*2,rad*2);}
  bg.neb=n;
  bg.layers=[[.04,240,.45,.9],[.12,110,.7,1.3],[.25,40,1,1.9]].map(function(p){
    var t=document.createElement('canvas'),S=512;t.width=S*DPR;t.height=S*DPR;var tc=t.getContext('2d');tc.scale(DPR,DPR);
    for(var i=0;i<p[1];i++){var a=p[2]*(.35+r()*.65),sz=(r()*.6+.4)*p[3]*(r()<.06?1.8:1),x=r()*S,y=r()*S;
      var col=r()<.18?'170,200,255':r()<.1?'255,220,180':'255,255,255';
      if(sz>1.6){var g=tc.createRadialGradient(x,y,0,x,y,sz*3);g.addColorStop(0,'rgba('+col+','+a+')');g.addColorStop(1,'rgba('+col+',0)');tc.fillStyle=g;tc.fillRect(x-sz*3,y-sz*3,sz*6,sz*6);}
      tc.fillStyle='rgba('+col+','+a+')';tc.beginPath();tc.arc(x,y,sz/2,0,6.283);tc.fill();}
    return{c:t,p:p[0],S:S};});
  bg.tw=[];for(var i=0;i<16;i++)bg.tw.push({x:r(),y:r(),s:1+r()*1.5,ph:r()*6,sp:.6+r()*1.4});
}
function buildAsteroids(){
  var r=rng(97);asts=[];var A=L.ast;
  for(var i=0;i<16;i++){var ang=r()*6.283,d=.25+.75*Math.sqrt(r());var sz=i<3?13+r()*6:4+r()*9;
    var pts=[],nv=7+Math.floor(r()*4);for(var k=0;k<nv;k++)pts.push(.72+r()*.4);
    asts.push({x:A.x+Math.cos(ang)*A.rx*d,y:A.y+Math.sin(ang)*A.ry*d,s:sz,pts:pts,rot:r()*6,sp:(r()-.5)*.35,dx:(r()-.5)*2,dy:(r()-.5)*2});}
  asts.dust=[];for(var j=0;j<36;j++)asts.dust.push({a:r()*6.283,d:Math.sqrt(r()),s:r()*1.2+.3,o:r()*.5+.1});
}
function w2s(x,y){return{x:(x-cam.x)*cam.z+W/2,y:(y-cam.y)*cam.z+H/2};}
function s2w(x,y){return{x:(x-W/2)/cam.z+cam.x,y:(y-H/2)/cam.z+cam.y};}
function setW(){ctx.setTransform(DPR*cam.z,0,0,DPR*cam.z,DPR*(W/2-cam.x*cam.z),DPR*(H/2-cam.y*cam.z));}
function setS(){ctx.setTransform(DPR,0,0,DPR,0,0);}
var hits=[],tags=[];
function hit(o){hits.push(o);}
var ST={mkt:{x:0,y:-150},money:{x:0,y:152},comms:{x:132,y:-88},hangar:{x:-138,y:92}};
var BERTHS=[{x:-156,y:-8},{x:156,y:8},{x:-146,y:-100},{x:146,y:98},{x:-178,y:40},{x:178,y:-45},{x:-90,y:-210},{x:90,y:210}];
var FUELPOS=[-40,-56,-72,40,56,72];
function crewX(i){return -48+i*32;}
function hexA(h){var n=parseInt(h.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+',A)';}
function glow(x,y,r,col,a){if(r<=0)return;var g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col.replace('A',(+a).toFixed(3)));g.addColorStop(1,col.replace('A','0'));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}
function metal(x0,y0,x1,y1,dark){var g=ctx.createLinearGradient(x0,y0,x1,y1);
  if(dark){g.addColorStop(0,'#0c1424');g.addColorStop(.45,'#3a4c6a');g.addColorStop(.55,'#56698a');g.addColorStop(1,'#0a101c');}
  else{g.addColorStop(0,'#1a2438');g.addColorStop(.4,'#7f95b8');g.addColorStop(.52,'#c4d4ec');g.addColorStop(.65,'#6a7fa2');g.addColorStop(1,'#121a2a');}return g;}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function blink(t,sp,ph){return .5+.5*Math.sin(t*sp+(ph||0));}
function add(){ctx.globalCompositeOperation='lighter';}function norm(){ctx.globalCompositeOperation='source-over';}
function drawShip(x,y,ang,s,col,opt){
  opt=opt||{};ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  if(opt.engine!==false){add();var fl=opt.flick||1;glow(-s*.55,0,s*1.1*fl,'rgba(120,220,255,A)',.55);
    ctx.fillStyle='rgba(220,250,255,.9)';ctx.beginPath();ctx.ellipse(-s*.55,0,s*.28*fl,s*.12,0,0,6.283);ctx.fill();norm();}
  ctx.beginPath();ctx.moveTo(s,0);ctx.lineTo(-s*.25,s*.34);ctx.lineTo(-s*.62,s*.72);ctx.lineTo(-s*.5,s*.2);ctx.lineTo(-s*.55,0);ctx.lineTo(-s*.5,-s*.2);ctx.lineTo(-s*.62,-s*.72);ctx.lineTo(-s*.25,-s*.34);ctx.closePath();
  var g=ctx.createLinearGradient(0,-s*.7,0,s*.7);g.addColorStop(0,'#27354f');g.addColorStop(.45,'#b8c8e2');g.addColorStop(.6,'#5a6c8c');g.addColorStop(1,'#101828');
  ctx.fillStyle=opt.tint||g;ctx.fill();ctx.lineWidth=Math.max(.8,s*.07);ctx.strokeStyle=col;ctx.stroke();
  ctx.fillStyle=col;ctx.globalAlpha=.6;ctx.beginPath();ctx.moveTo(s*.1,-s*.34);ctx.lineTo(-s*.25,-s*.34);ctx.lineTo(-s*.6,-s*.7);ctx.lineTo(-s*.45,-s*.7);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(s*.1,s*.34);ctx.lineTo(-s*.25,s*.34);ctx.lineTo(-s*.6,s*.7);ctx.lineTo(-s*.45,s*.7);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
  var cg=ctx.createLinearGradient(s*.2,-s*.1,s*.6,s*.1);cg.addColorStop(0,'#e8fbff');cg.addColorStop(1,col);ctx.fillStyle=cg;ctx.beginPath();ctx.ellipse(s*.38,0,s*.2,s*.09,0,0,6.283);ctx.fill();
  ctx.restore();
}
function drawBackground(t){
  setS();var px=cam.x*cam.z,py=cam.y*cam.z;
  ctx.drawImage(bg.neb,-W*.125-px*.02,-H*.125-py*.02,W*1.25,H*1.25);
  var sx=W*(portrait?.9:.86)-px*.03,sy=H*(portrait?.16:.12)-py*.03;
  add();glow(sx,sy,Math.max(W,H)*.45,'rgba(120,170,255,A)',.14);glow(sx,sy,55,'rgba(255,245,230,A)',.85);glow(sx,sy,12,'rgba(255,255,255,A)',1);
  ctx.globalAlpha=.22;ctx.strokeStyle='#bcd6ff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(sx-150,sy);ctx.lineTo(sx+150,sy);ctx.stroke();ctx.globalAlpha=1;norm();
  var pr=Math.max(W,H)*(portrait?.42:.34),plx=(portrait?-pr*.45:W*.06)-px*.06,ply=(portrait?H*.72:H*1.0)-py*.06;
  var pg=ctx.createRadialGradient(plx+pr*.45,ply-pr*.45,pr*.05,plx,ply,pr);pg.addColorStop(0,'#3d6fb0');pg.addColorStop(.35,'#1c3a70');pg.addColorStop(.7,'#0b1834');pg.addColorStop(1,'#03060e');
  ctx.save();ctx.beginPath();ctx.arc(plx,ply,pr,0,6.283);ctx.fillStyle=pg;ctx.fill();ctx.clip();
  ctx.globalAlpha=.1;for(var b=0;b<9;b++){ctx.fillStyle=b%2?'#9cc4ff':'#0a1a3a';ctx.beginPath();ctx.ellipse(plx,ply-pr*.7+b*pr*.18,pr*1.2,pr*.05,-.25,0,6.283);ctx.fill();}
  ctx.globalAlpha=1;ctx.restore();
  add();ctx.lineWidth=3;ctx.strokeStyle='rgba(120,200,255,.35)';ctx.beginPath();ctx.arc(plx,ply,pr+1,-2.2,.2);ctx.stroke();norm();
  for(var li=0;li<bg.layers.length;li++){var Ly=bg.layers[li],S=Ly.S,ox=((-px*Ly.p)%S+S)%S-S,oy=((-py*Ly.p)%S+S)%S-S;
    for(var x=ox;x<W;x+=S)for(var y=oy;y<H;y+=S)ctx.drawImage(Ly.c,x,y,S,S);}
  if(!RM){add();bg.tw.forEach(function(s){glow(s.x*W,s.y*H,s.s*4,'rgba(210,230,255,A)',(.2+.8*blink(t,s.sp,s.ph))*.8);});norm();}

  var r=e.target.closest('[data-open]');if(r){var p=r.getAttribute('data-open').split(':');openItem(p[0],p.slice(1).join(':'),true,true);}});

  var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);showToast(ok?msg:'COPY FAILED · USE PREVIEW');}
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(function(){showToast(msg);},fb);else fb();}

  items.map(function(i){return'<button data-sr="ship:'+esc(i.id)+'">Ship: '+esc(i.name)+' ('+esc((SL[i.state]||[i.state])[0])+')</button>';}).join('');
